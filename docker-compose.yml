services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    # ports:
    #   - "1883:1883"
    volumes:
      - ${APPDATA:-/mnt/user/appdata/vanguard}/mosquitto/config:/mosquitto/config
      - ${APPDATA:-/mnt/user/appdata/vanguard}/mosquitto/data:/mosquitto/data
    command:
      - sh
      - -c
      - |
        if [ ! -f /mosquitto/config/mosquitto.conf ]; then
          printf '%s\n' \
            'listener 1883' \
            'allow_anonymous true' \
            'persistence true' \
            'persistence_location /mosquitto/data/' \
            'log_dest stdout' \
            > /mosquitto/config/mosquitto.conf
          echo "seeded default mosquitto.conf"
        fi
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    shm_size: "256mb"
    depends_on:
      - mosquitto
    devices:
      - /dev/dri:/dev/dri
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - ${CONFIG_PATH:-/mnt/user/appdata/vanguard/frigate}:/config
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_PATH:-/mnt/user/frigate}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"
      # - "8554:8554"
      # - "8555:8555/tcp"
      # - "8555:8555/udp"
    environment:
      FRIGATE_RTSP_PASSWORD: ${RTSP_PASSWORD:-}

  ntfy-bridge:
    image: ghcr.io/kaiserdrake/vanguard-ntfy-bridge:latest
    container_name: ntfy-bridge
    restart: unless-stopped
    depends_on:
      - mosquitto
      - frigate
    volumes:
      - ${APPDATA:-/mnt/user/appdata/vanguard}/ntfy-bridge:/config
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      FRIGATE_URL: http://frigate:5000
      FRIGATE_UI_URL: ${FRIGATE_UI_URL:-http://localhost:5000}
      NTFY_URL: ${NTFY_URL:?set NTFY_URL in .env}
      NTFY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC in .env}
      NTFY_AUTH_TOKEN: ${NTFY_AUTH_TOKEN:-}
      NOTIFY_LABELS: ${NOTIFY_LABELS:-person,car,dog,cat}

  scheduler:
    image: ghcr.io/kaiserdrake/vanguard-scheduler:latest
    container_name: camera-scheduler
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ${APPDATA:-/mnt/user/appdata/vanguard}/scheduler:/config
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      TZ: ${TZ:-UTC}
