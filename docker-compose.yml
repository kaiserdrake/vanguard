# Production stack. Deploy by cloning this repo on the host and running
# `docker compose up -d` from the checkout — the `init` service stages the
# default configs into $APPDATA on first start, so there is nothing to copy
# by hand and nothing to edit inside the checkout.
services:
  # Seeds $APPDATA from defaults/ and exits. Copy-if-absent, so it is a no-op
  # on every start after the first: whatever you have edited under $APPDATA
  # always wins, and `git pull` can bring in a new default without overwriting
  # a live config. To take a new default, delete the live file and restart.
  #
  # This is why the repo's own config files are never bind-mounted into the
  # services: Frigate rewrites its config.yml in place (schema migrations, and
  # every edit made in the UI's Config Editor), which would leave a dirty
  # working tree that the next `git pull` refuses to fast-forward over.
  init:
    image: alpine:3
    container_name: vanguard-init
    restart: "no"
    volumes:
      - ./defaults:/defaults:ro
      - ${APPDATA:-./data}:/appdata
    command:
      - sh
      - -euc
      - |
        cd /defaults
        # What gets created inherits $$APPDATA's ownership rather than root's,
        # so pre-creating the directory as yourself is enough to edit
        # schedule.yml or cameras-meta.yml later without sudo. When docker
        # created $$APPDATA itself it is root-owned and this is a no-op.
        owner=$$(stat -c %u:%g /appdata)
        find . -mindepth 1 -type d | while read -r d; do
          [ -d "/appdata/$${d#./}" ] || {
            mkdir "/appdata/$${d#./}" && chown "$$owner" "/appdata/$${d#./}"
          }
        done
        find . -type f | while read -r f; do
          src=$${f#./}
          if [ -e "/appdata/$$src" ]; then
            echo "keep  $$src (already in \$$APPDATA)"
          else
            cp "$$f" "/appdata/$$src" && chown "$$owner" "/appdata/$$src"
            echo "seed  $$src"
          fi
        done

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    # ports:
    #   - "1883:1883"
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APPDATA:-./data}/mosquitto/config:/mosquitto/config
      - ${APPDATA:-./data}/mosquitto/data:/mosquitto/data

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    shm_size: "256mb"
    depends_on:
      init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    devices:
      - /dev/dri:/dev/dri
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      # Read-write, and it has to be: Frigate migrates and rewrites config.yml
      # itself, and the UI's Config Editor saves here.
      - ${APPDATA:-./data}/frigate:/config
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_PATH:-./media}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      # 8090 on the host, 8971 in the container — the authenticated port is
      # fixed inside Frigate's nginx, so only the left side is ours to pick.
      # Whatever it is, it has to match the port in FRIGATE_UI_URL, or a
      # notification tap opens nothing.
      - "8068:8971"
      # - "8554:8554"
      # - "8555:8555/tcp"
      # - "8555:8555/udp"
    environment:
      FRIGATE_RTSP_PASSWORD: ${RTSP_PASSWORD:-}

  ntfy-bridge:
    image: ghcr.io/kaiserdrake/vanguard-ntfy-bridge:latest
    container_name: ntfy-bridge
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
      frigate:
        condition: service_started
    volumes:
      - ${APPDATA:-./data}/ntfy-bridge:/config
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      FRIGATE_URL: http://frigate:5000
      FRIGATE_UI_URL: ${FRIGATE_UI_URL:-http://localhost:5000}
      NTFY_URL: ${NTFY_URL:?set NTFY_URL in .env}
      NTFY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC in .env}
      NTFY_AUTH_TOKEN: ${NTFY_AUTH_TOKEN:-}
      NOTIFY_LABELS: ${NOTIFY_LABELS:-visitor}

  scheduler:
    image: ghcr.io/kaiserdrake/vanguard-scheduler:latest
    container_name: camera-scheduler
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    volumes:
      - ${APPDATA:-./data}/scheduler:/config
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      TZ: ${TZ:-UTC}
