name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - "ntfy-bridge/**"
      - "scheduler/**"
      - "tests/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    paths:
      - "ntfy-bridge/**"
      - "scheduler/**"
      - "tests/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integration test
        run: ./tests/run_test.sh

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./ntfy-bridge
            image: vanguard-ntfy-bridge
          - context: ./scheduler
            image: vanguard-scheduler

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests build to validate the Dockerfile, but never publish.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
