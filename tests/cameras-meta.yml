front_door: Front door
# non-ASCII label: exercises the RFC 2047 header encoding path
side_gate: 玄関わき

# mapping form: NOTIFY_LABELS is person,car in docker-compose.test.yml, so this
# camera both widens (dog) and narrows (no person) it, and overrides the
# person=high/other=default priority rule.
garage:
  name: Garage
  labels: [dog]
  priority: low

# muted: recorded and detected by Frigate, never pushed
shed:
  labels: []

# unparseable values are skipped per key, not fatal for the file or the camera
side_yard:
  name: Side yard
  priority: shouting

# visitor zones: a person inside `doorstep` pushes as "visitor", a person
# anywhere else on this camera is detected and recorded but never pushed.
# The front-door shape.
porch_cam:
  name: Porch
  labels: [visitor]
  visitor: doorstep

# both labels: one push when a person appears, a second when the same person
# reaches the zone. Exercises the mapping form and the explicit `from`.
drive_cam:
  name: Driveway
  visitor:
    zones: [gate, apron]
    from: person
  labels: [person, visitor]

# a visitor rule with no zones can never match, so it is dropped rather than
# left to silence the camera; `labels` still applies
back_gate:
  name: Back gate
  visitor: []
