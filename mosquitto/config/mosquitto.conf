listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# stdout, not a file. The image's entrypoint chowns /mosquitto/data to the
# mosquitto user but not /mosquitto/log, so a bind-mounted log directory is
# owned by the host user and the broker exits with "Unable to open log file
# for writing". Logging to stdout also means `docker logs mosquitto` and
# Unraid's log viewer actually show something.
log_dest stdout
